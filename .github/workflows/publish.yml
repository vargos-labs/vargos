name: Publish to NPM

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # pnpm in workspace mode does not read setup-node's userconfig .npmrc,
          # so write the registry credential into the workspace-root .npmrc
          # ourselves. (.npmrc is not in package.json "files" — never in the tarball.)
          npm config set --location project "//registry.npmjs.org/:_authToken" "$NODE_AUTH_TOKEN"
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version: $VERSION"
          # --no-git-checks: pnpm 10 refuses to publish from a detached HEAD (CI checkout)
          pnpm publish --access public --no-git-checks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body: |
            📦 Version ${{ env.VERSION }}

            **Changes:** Published from main branch

            [View on npm](https://www.npmjs.com/package/@vargos-labs/vargos/v/${{ env.VERSION }})
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
